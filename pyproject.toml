[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rca-agent"
version = "0.0.1"
description = "Root Cause Analysis auto-diagnosis agent built on deepagents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.5.3",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
rca-agent = "rca_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rca_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
